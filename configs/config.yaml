seed: 42

data_dir: "D:/CVLab/temp/SAM/cars_dataset"
mask_root: "D:/CVLab/temp/SAM/sam_pseudo_masks_cars"
image_size: 224
batch_size: 16
val_ratio: 0.2
test_ratio: 0.1
num_workers: 0

pretrained: true

epochs: 20
learning_rate: 0.0001
weight_decay: 0.0001

scheduler: "cosine"
eta_min: 0.000001

use_amp: false
early_stopping: true
early_stopping_monitor: val_acc     # val_loss / train_loss / train_acc
early_stopping_patience: 10
early_stopping_min_delta: 0.0


# Total loss:
# loss = classification_loss + lambda_cam * CAMMaskLoss
lambda_cam: 1.0
outside_weight: 1.0
inside_weight: 1.0

# just specify one of these two parameters, not both. If both are null, use all training samples.
train_shots_per_class: 16  
train_fraction: null         

# Debugging: after training, run the model on the held-out test set and
# save CAM overlays for the worst (highest-loss) predictions.
cam_debug: true
cam_debug_top_k: 20

# ---------------------------------------------------------------------
# Diagnostics. Everything below only observes the run and writes files to
# <run_dir>/diagnostics/ ; none of it changes training. Set `diagnostics`
# to false to turn the whole thing off.
# ---------------------------------------------------------------------
diagnostics: true

# Audits the SAM pseudo-masks before training starts: class-name matching,
# manifest exclusions, missing files, 0/1-vs-0/255 pixel scale, coverage,
# mask polarity, and the containment values that are physically achievable
# on the CAM grid. Read diagnostics/mask_audit.md first when a run looks odd.
mask_audit: true
mask_audit_max_decoded: 600   # masks actually opened per split; null = all
mask_audit_examples: 12

# Per-epoch CAM statistics: absolute background activation next to the
# containment ratio, plus the flat-CAM and perfect-CAM baselines.
cam_stats: true

# Backprops the CE and CAM terms separately (without stepping) to compare
# their gradient magnitudes and check whether they conflict.
grad_probe: true
grad_probe_batches: 3

# The same validation images rendered every epoch, so the CAM's evolution
# is visible rather than inferred.
cam_snapshots: true
cam_snapshots_count: 8
cam_snapshots_every: 1

output_dir: "outputs_resnet18_WOPT_WOCL_AnnealingLR_Epoch20_LR0.0001_WD0.0001_lambdaCAM0.5_MAXNORM"

mask_dirs:
  cat: "sam_pseudo_masks_cat/masks"
  dog: "sam_pseudo_masks_dog/masks"

mask_manifests:
  cat: "sam_pseudo_masks_cat/manifest_cat_masks.csv"
  dog: "sam_pseudo_masks_dog/manifest_dog_masks.csv"

model_type: "adapter"    # with conv adapter

adapter_gamma: 4
adapter_kernel_size: 3
freeze_backbone: true